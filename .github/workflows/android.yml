name: Build LotteryLab Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            patch \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf mobile/.buildozer

      - name: Verify Buildozer configuration
        working-directory: mobile
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "===== Kivy references ====="
          grep -Rni "kivy" . --exclude-dir=.buildozer || true

      - name: Build APK
        working-directory: mobile
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Mobile-APK
          path: mobile/bin/*.apk
          