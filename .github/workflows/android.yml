name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python 3.12
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Install only required system build tools
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -eux

          echo "===== Updating apt ====="
          sudo apt-get update

          echo "===== Installing build tools ====="
          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

          echo "===== System dependencies installed ====="

      # ---------------------------------------------------------
      # 5. Verify build environment
      # ---------------------------------------------------------
      - name: Verify environment
        run: |
          set -eux

          echo "===== Python ====="
          python --version
          python -m pip --version

          echo "===== Java ====="
          java -version

          echo "===== Git ====="
          git --version

          echo "===== Autoconf ====="
          autoconf --version | head -1

          echo "===== Automake ====="
          automake --version | head -1

          echo "===== Libtool ====="
          libtool --version | head -1

          echo "===== CMake ====="
          cmake --version | head -1

      # ---------------------------------------------------------
      # 6. Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer

      # ---------------------------------------------------------
      # 7. Verify Buildozer
      # ---------------------------------------------------------
      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux

          echo "===== Buildozer version ====="
          buildozer --version

          echo "===== buildozer.spec ====="
          cat buildozer.spec

          echo "===== Requirements ====="
          grep "^requirements" buildozer.spec

          echo "===== Android API ====="
          grep "^android.api" buildozer.spec

          echo "===== Android minimum API ====="
          grep "^android.minapi" buildozer.spec

          echo "===== Android architectures ====="
          grep "^android.archs" buildozer.spec

          echo "===== Python pins ====="
          if grep -n "python3==" buildozer.spec; then
            echo "ERROR: python3 version is explicitly pinned"
            exit 1
          else
            echo "OK: python3 is not explicitly pinned"
          fi

      # ---------------------------------------------------------
      # 8. Clean all previous Android build state
      # ---------------------------------------------------------
      - name: Clean Buildozer
        working-directory: mobile
        run: |
          set -eux

          echo "===== Removing old Buildozer state ====="

          rm -rf .buildozer
          rm -rf bin

          echo "===== Buildozer state cleaned ====="

      # ---------------------------------------------------------
      # 9. Build Android APK
      # ---------------------------------------------------------
      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -eux

          echo "===== Starting Buildozer Android build ====="
          echo "===== This may take some time on the first build ====="

          buildozer -v android debug

          echo "===== Buildozer build completed ====="

      # ---------------------------------------------------------
      # 10. Show generated APK
      # ---------------------------------------------------------
      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # 11. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          