name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build LotteryLab Android APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # PYTHON 3.12.13
      # ---------------------------------------------------------

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: "pip"

      - name: Verify Python
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version
          python -m pip --version

          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"

          python -c "import sys; assert sys.version_info[:3] == (3, 12, 13), 'Python 3.12.13 is required'"

          echo "Python 3.12.13 confirmed."

      # ---------------------------------------------------------
      # JAVA 17
      # ---------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            ccache \
            gettext \
            curl

      # ---------------------------------------------------------
      # RUST
      # ---------------------------------------------------------

      - name: Install Rust
        run: |
          set -eux

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # PYTHON BUILD TOOLS
      # ---------------------------------------------------------

      - name: Install Python build tools
        run: |
          set -eux

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            virtualenv

          python -m pip install \
            legacy-cgi \
            "cython>=3.1.0"

      # ---------------------------------------------------------
      # BUILDOZER
      # ---------------------------------------------------------

      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version

      # ---------------------------------------------------------
      # VERIFY CONFIGURATION
      # ---------------------------------------------------------

      - name: Verify buildozer.spec
        working-directory: mobile
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "REQUIRED SETTINGS"
          echo "========================================"

          grep -q "^requirements = python3==3.12.13,hostpython3==3.12.13" buildozer.spec
          grep -q "^android.api = 36" buildozer.spec
          grep -q "^android.ndk = 28c" buildozer.spec
          grep -q "^android.minapi = 24" buildozer.spec
          grep -q "^android.archs = arm64-v8a" buildozer.spec
          grep -q "^p4a.bootstrap = sdl2" buildozer.spec
          grep -q "^p4a.branch = master" buildozer.spec
          grep -q "^p4a.python_version = 3.12.13" buildozer.spec

          echo "========================================"
          echo "CONFIGURATION CHECK PASSED"
          echo "========================================"

      # ---------------------------------------------------------
      # CLEAN BUILD
      # ---------------------------------------------------------

      - name: Clean Android build
        working-directory: mobile
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

          echo "Clean Android build directory prepared."

      # ---------------------------------------------------------
      # DISABLE GRP REQUIREMENT
      # ---------------------------------------------------------

      - name: Disable Python grp module
        working-directory: mobile
        run: |
          set -eux

          echo "Disabling grp module for Android..."

          printf '%s\n' '--blacklist-requirements=grp' > .p4a

          echo "Contents of .p4a:"
          cat .p4a

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------

      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

        run: |
          set -eux

          echo "========================================"
          echo "LOTTERYLAB ANDROID BUILD"
          echo "========================================"

          echo "Host Python:"
          python --version

          echo "Python executable:"
          python -c "import sys; print(sys.executable)"

          echo "Python version:"
          python -c "import sys; print(sys.version)"

          echo "========================================"
          echo "STARTING BUILDOZER"
          echo "========================================"

          buildozer -v --stacktrace android debug

      # ---------------------------------------------------------
      # FIND APK
      # ---------------------------------------------------------

      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "========================================"
          echo "BIN DIRECTORY"
          echo "========================================"

          ls -lah bin || true

          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find . -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
