# LotteryLab Mobile Android Build

name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # PYTHON 3.14
      # ---------------------------------------------------------

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python 3.14
        run: |
          set -eux

          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"

          python --version
          python -m pip --version

          python -c "import sys; print(sys.executable)"
          python -c "print(sys.version)"

          python -c "import sys; assert sys.version_info[:2] == (3, 14), 'Python 3.14 is required'"

          echo "Python 3.14 confirmed."

      # ---------------------------------------------------------
      # JAVA 17
      # ---------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            ccache \
            gettext

      # ---------------------------------------------------------
      # RUST
      # ---------------------------------------------------------

      - name: Install Rust
        run: |
          set -eux

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # PYTHON BUILD TOOLS
      # ---------------------------------------------------------

      - name: Install Python build tools
        run: |
          set -eux

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            virtualenv

          python -m pip install \
            legacy-cgi \
            cython==0.29.34

      # ---------------------------------------------------------
      # BUILDOZER
      # ---------------------------------------------------------

      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER VERSION"
          echo "========================================"

          buildozer --version

      # ---------------------------------------------------------
      # VERIFY BUILDOZER CONFIGURATION
      # ---------------------------------------------------------

      - name: Verify buildozer.spec
        working-directory: mobile
        run: |
          set -eux

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec

          echo "========================================"
          echo "PYTHON REQUIREMENTS"
          echo "========================================"

          grep -n "^requirements" buildozer.spec || true

          echo "========================================"
          echo "ANDROID SETTINGS"
          echo "========================================"

          grep -n "^android.api" buildozer.spec || true
          grep -n "^android.ndk" buildozer.spec || true
          grep -n "^android.minapi" buildozer.spec || true
          grep -n "^android.archs" buildozer.spec || true

          echo "========================================"
          echo "PYTHON-FOR-ANDROID SETTINGS"
          echo "========================================"

          grep -n "^p4a.bootstrap" buildozer.spec || true
          grep -n "^p4a.branch" buildozer.spec || true

      # ---------------------------------------------------------
      # VERIFY REQUIRED SETTINGS
      # ---------------------------------------------------------

      - name: Check Python 3.14 Android configuration
        working-directory: mobile
        run: |
          set -eux

          echo "Checking Python 3.14 Android configuration..."

          grep -q "^requirements = python3" buildozer.spec

          grep -q "^android.api = 36" buildozer.spec

          grep -q "^android.ndk = 29" buildozer.spec

          grep -q "^android.archs = arm64-v8a" buildozer.spec

          grep -q "^p4a.bootstrap = sdl2" buildozer.spec

          grep -q "^p4a.branch = develop" buildozer.spec

          echo "Configuration checks passed."

      # ---------------------------------------------------------
      # CLEAN BUILD
      # ---------------------------------------------------------

      - name: Clean Android build
        working-directory: mobile
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          echo "Clean Android build directory prepared."

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------

      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

        run: |
          set -eux

          echo "========================================"
          echo "LOTTERYLAB ANDROID BUILD"
          echo "========================================"

          echo "Host Python:"
          python --version

          echo "Starting Buildozer..."

          buildozer -v --stacktrace android debug

      # ---------------------------------------------------------
      # FIND APK
      # ---------------------------------------------------------

      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "========================================"
          echo "BIN DIRECTORY"
          echo "========================================"

          ls -lah bin || true

          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find . -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error

