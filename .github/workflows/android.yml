name: Build LotteryLab Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Clean old Android build
        working-directory: mobile
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Verify build configuration
        working-directory: mobile
        run: |
          echo "===== Python ====="
          python --version
          echo "===== Buildozer ====="
          buildozer --version
          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Build APK
        working-directory: mobile
        env:
          P4A_RELEASE: "master"
        run: |
          yes | buildozer android debug

      - name: Find APK
        working-directory: mobile
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Mobile-APK
          path: mobile/bin/*.apk
          