name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Verify build environment
        run: |
          set -eux
          echo "========================================"
          echo "Python"
          echo "========================================"
          python --version
          python -m pip --version

          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

          echo "========================================"
          echo "Build tools"
          echo "========================================"
          git --version
          autoconf --version | head -1
          automake --version | head -1
          libtool --version | head -1
          cmake --version | head -1

      - name: Install Python build tools
        run: |
          set -eux
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            virtualenv
          python -m pip install buildozer

      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux
          echo "========================================"
          echo "Buildozer version"
          echo "========================================"
          buildozer --version

      - name: Verify buildozer.spec
        working-directory: mobile
        run: |
          set -eux
          echo "========================================"
          echo "buildozer.spec"
          echo "========================================"
          cat buildozer.spec

          echo "========================================"
          echo "Important settings"
          echo "========================================"
          grep -n "^requirements" buildozer.spec || true
          grep -n "^android.api" buildozer.spec || true
          grep -n "^android.minapi" buildozer.spec || true
          grep -n "^android.archs" buildozer.spec || true
          grep -n "^p4a.bootstrap" buildozer.spec || true
          grep -n "^p4a.branch" buildozer.spec || true

      - name: Clean Android build
        working-directory: mobile
        run: |
          set -eux
          rm -rf .buildozer
          rm -rf bin
          echo "Clean build directory prepared."

      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -eux
          echo "========================================"
          echo "Starting LotteryLab Android build"
          echo "========================================"
          python --version
          buildozer -v android debug

      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "========================================"
          echo "BIN DIRECTORY"
          echo "========================================"
          ls -lah bin || true

          echo "========================================"
          echo "APK FILES"
          echo "========================================"
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error