name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python 3.12
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Install Android build dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      # ---------------------------------------------------------
      # 5. Verify environment
      # ---------------------------------------------------------
      - name: Verify environment
        run: |
          set -eux

          echo "===== Python ====="
          python --version
          python -m pip --version

          echo "===== Java ====="
          java -version

          echo "===== Build tools ====="
          autoconf --version | head -1
          automake --version | head -1
          libtool --version | head -1
          cmake --version | head -1

      # ---------------------------------------------------------
      # 6. Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer

      # ---------------------------------------------------------
      # 7. Verify Buildozer configuration
      # ---------------------------------------------------------
      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux

          buildozer --version

          echo "===== BUILDZER SPEC ====="
          cat buildozer.spec

          echo "===== REQUIREMENTS ====="
          grep "^requirements" buildozer.spec

          echo "===== ANDROID API ====="
          grep "^android.api" buildozer.spec

          echo "===== ARCHITECTURES ====="
          grep "^android.archs" buildozer.spec

      # ---------------------------------------------------------
      # 8. Clean previous Android build
      # ---------------------------------------------------------
      - name: Clean Buildozer
        working-directory: mobile
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

      # ---------------------------------------------------------
      # 9. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -eux

          buildozer -v android debug

      # ---------------------------------------------------------
      # 10. Show APK
      # ---------------------------------------------------------
      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # 11. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          