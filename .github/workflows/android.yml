name: Build LotteryLab Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Verify runner
      # ---------------------------------------------------------
      - name: Verify runner
        run: |
          set -eux

          echo "===== Python ====="
          python --version
          python -m pip --version

          echo "===== Java ====="
          java -version

          echo "===== Git ====="
          git --version

          echo "===== Autoconf ====="
          autoconf --version | head -1

          echo "===== Automake ====="
          automake --version | head -1

          echo "===== Libtool ====="
          if command -v libtool >/dev/null 2>&1; then
            libtool --version | head -1
          else
            echo "libtool not currently installed"
          fi

      # ---------------------------------------------------------
      # 5. Install only missing build tools
      # ---------------------------------------------------------
      - name: Install required build tools
        run: |
          set -eux

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            autoconf \
            automake \
            cmake \
            libffi-dev \
            libssl-dev

      # ---------------------------------------------------------
      # 6. Verify build tools
      # ---------------------------------------------------------
      - name: Verify build tools
        run: |
          set -eux

          echo "===== Autoconf ====="
          autoconf --version | head -1

          echo "===== Automake ====="
          automake --version | head -1

          echo "===== Libtool ====="
          libtool --version | head -1

          echo "===== CMake ====="
          cmake --version | head -1

      # ---------------------------------------------------------
      # 7. Upgrade Python tools
      # ---------------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            virtualenv \
            buildozer

      # ---------------------------------------------------------
      # 8. Check Buildozer
      # ---------------------------------------------------------
      - name: Verify Buildozer
        working-directory: mobile
        run: |
          set -eux

          buildozer --version

      # ---------------------------------------------------------
      # 9. Check configuration
      # ---------------------------------------------------------
      - name: Verify buildozer.spec
        working-directory: mobile
        run: |
          set -eux

          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

          grep -n "^\[app\]" buildozer.spec
          grep -n "^requirements" buildozer.spec
          grep -n "^android.api" buildozer.spec
          grep -n "^android.archs" buildozer.spec

      # ---------------------------------------------------------
      # 10. Clean old Buildozer state
      # ---------------------------------------------------------
      - name: Clean Buildozer
        working-directory: mobile
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

      # ---------------------------------------------------------
      # 11. Build APK
      # ---------------------------------------------------------
      - name: Build Android APK
        working-directory: mobile
        env:
          ACCEPT_EULA: "Y"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -eux

          buildozer -v android debug

      # ---------------------------------------------------------
      # 12. Show APK
      # ---------------------------------------------------------
      - name: List APK files
        if: always()
        working-directory: mobile
        run: |
          echo "===== BIN ====="
          ls -lah bin || true

          echo "===== APK ====="
          find . -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LotteryLab-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          